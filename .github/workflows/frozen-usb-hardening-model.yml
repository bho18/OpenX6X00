            if mode == '160000':
                skipped_gitlinks.append(name)
                continue
            path = Path(name)
            if mode not in ('100644', '100755') or not stat.S_ISREG(path.lstat().st_mode):
                raise SystemExit('Unexpected tracked nonregular file: ' + name)
            with path.open('rb') as stream:
                files[name] = hashlib.file_digest(stream, 'sha256').hexdigest()
        files = dict(sorted(files.items()))
        tree = hashlib.sha256(''.join(digest + '  ' + name + '\n' for name, digest in files.items()).encode()).hexdigest()
        receipt = {
            'schema': 'x6200.usb.ci-tested-source.v1',
            'source_commit': actual,
            'expected_source_commit': expected,
            'source_worktree_dirty': False,
            'source_files': files,
            'source_file_count': len(files),
            'source_tree_sha256': tree,
            'skipped_gitlinks': sorted(skipped_gitlinks),
            'workflow_commit': os.environ['GITHUB_SHA'],
            'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
            'job': os.environ['GITHUB_JOB'],
            'run_id': os.environ['GITHUB_RUN_ID'],
            'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
        }
        output = Path(os.environ['RUNNER_TEMP']) / ('tested-source-' + os.environ['GITHUB_JOB'] + '.json')
        output.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
        print(json.dumps({key: value for key, value in receipt.items() if key != 'source_files'}, sort_keys=True))
        print('Source receipt: ' + str(output))
    - name: Install pinned-codec and private audio test build prerequisites
      timeout-minutes: 10
      run: |
        python3 tools/freedv/test_ci_ubuntu_sources.py
        sudo python3 tools/freedv/ci_ubuntu_sources.py
        task_apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
        sudo apt-get "${task_apt_options[@]}" update
        sudo env DEBIAN_FRONTEND=noninteractive apt-get "${task_apt_options[@]}" install -y --no-install-recommends \
          build-essential cmake ninja-build autoconf automake libtool pkg-config \
          libpulse-dev libsamplerate0-dev libsndfile1-dev pulseaudio pulseaudio-utils python3-venv
        python3 -m venv "$RUNNER_TEMP/usb-observer-python"
        "$RUNNER_TEMP/usb-observer-python/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5
        echo "$RUNNER_TEMP/usb-observer-python/bin" >> "$GITHUB_PATH"
    - name: Acquire exact pinned Opus model through verified cache
      timeout-minutes: 10
      shell: bash
      run: |
        set -euo pipefail
        model_name="opus_data-${OPUS_MODEL_SHA256}.tar.gz"
        model_dir="$RUNNER_TEMP/verified-opus-model"
        mkdir -p "$model_dir" "$RUNNER_TEMP/model-download-bin"
        model_path="$model_dir/$model_name"
        export OPUS_PINNED_MODEL_PATH="$model_path"
        python3 - <<'PYMODEL'
        import hashlib,json,os,subprocess
        from pathlib import Path
        expected=os.environ['OPUS_MODEL_SHA256']
        target=Path(os.environ['OPUS_PINNED_MODEL_PATH'])
        urls=[os.environ['OPUS_MODEL_CACHE_URL'], 'https://media.xiph.org/opus/models/'+target.name]
        errors=[]
        for index,url in enumerate(urls):
            candidate=target.with_suffix('.candidate')
            try:
                outcome=subprocess.run(['curl','--fail','--location','--silent','--show-error',
                    '--connect-timeout','15','--max-time','240','--retry','1','--retry-max-time','260',
                    '--output',str(candidate),url],check=False,timeout=270)
            except subprocess.TimeoutExpired:
                candidate.unlink(missing_ok=True);errors.append({'url':url,'exit_code':124});continue
            if outcome.returncode:
                candidate.unlink(missing_ok=True);errors.append({'url':url,'exit_code':outcome.returncode});continue
            with candidate.open('rb') as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()
            if actual!=expected:
                candidate.unlink(missing_ok=True)
                raise SystemExit('Pinned Opus model checksum mismatch from '+url)
            if candidate.stat().st_size!=183514217:
                candidate.unlink(missing_ok=True);raise SystemExit('Pinned model size differs')
            candidate.replace(target)
            receipt={'schema':'x6200.usb.ci-model-acquisition.v1','source_url':url,
                'upstream_url':urls[1],'sha256':actual,'expected_sha256':expected,'bytes':target.stat().st_size,
                'fallback_attempts':errors,'product_source_modified':False,
                'workflow_commit':os.environ['GITHUB_SHA'],'tested_source_commit':os.environ['TESTED_SOURCE_COMMIT']}
            (target.parent/'model-acquisition.json').write_text(json.dumps(receipt,indent=2)+'\n')
            print(json.dumps(receipt,sort_keys=True));break
        else:raise SystemExit('Pinned Opus model acquisition failed: '+json.dumps(errors))
        PYMODEL
        cat > "$RUNNER_TEMP/model-download-bin/wget" <<'SHMODEL'
        #!/usr/bin/env bash
        set -euo pipefail
        expected_name="opus_data-${OPUS_MODEL_SHA256}.tar.gz"
        expected_url="https://media.xiph.org/opus/models/${expected_name}"
        if [[ "$#" == 3 && "$1" == "-O" && "$2" == "$expected_name" && "$3" == "$expected_url" ]]; then
          # Supply only the exact previously verified model. The unchanged Opus
          # download script independently checks its SHA again before extraction.
          cp -- "$OPUS_PINNED_MODEL_PATH" "$2"
          printf 'Verified pinned Opus model supplied from cache: %s\n' "$OPUS_MODEL_SHA256"
        else
          exec /usr/bin/wget "$@"
        fi
        SHMODEL
        chmod 755 "$RUNNER_TEMP/model-download-bin/wget"
        printf '%s\n' "$RUNNER_TEMP/model-download-bin" >> "$GITHUB_PATH"
        printf 'OPUS_PINNED_MODEL_PATH=%s\n' "$model_path" >> "$GITHUB_ENV"
        python3 - <<'PYSHIMRECEIPT'
        import hashlib,json,os
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        receipt_path=root/'verified-opus-model/model-acquisition.json'
        receipt=json.loads(receipt_path.read_text())
        shim=root/'model-download-bin/wget'
        receipt.update(shim_sha256=hashlib.sha256(shim.read_bytes()).hexdigest(),
            shim_scope='Only exact pinned official model URL and output basename; all other invocations delegate /usr/bin/wget',
            unchanged_opus_self_verification=True)
        receipt_path.write_text(json.dumps(receipt,indent=2)+'\n')
        print(json.dumps(receipt,sort_keys=True))
        PYSHIMRECEIPT
    - name: Build exact production controller and codec runner without the GUI
      timeout-minutes: 25
      run: |
        python3 tools/freedv/build_usb_controller_host.py --prepare-codec \
          --work "$RUNNER_TEMP/usb-controller-build" --jobs 2 \
          --build-id "usb-controller-ci-${GITHUB_SHA}" \
          > "$RUNNER_TEMP/usb-controller-build.log" 2>&1 || {
            task_status=$?
            python3 tools/freedv/usb_ci_diagnostics.py --work-root "$RUNNER_TEMP"
            exit "$task_status"
          }
    - name: Run complete controller regression and lifecycle cases on private PulseAudio
      timeout-minutes: 30
      run: |
        export LD_LIBRARY_PATH="$RUNNER_TEMP/usb-controller-build/codec/rade_c/src${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        python3 tools/freedv/test_usb_audio_matrix.py \
          "$RUNNER_TEMP/usb-controller-build/freedv_usb_audio_test" \
          "$RUNNER_TEMP/usb-controller-build/codec/sources/rade_c/input_sample.wav" \
          "$RUNNER_TEMP/usb-controller-build/usb-reference-48k.raw" \
          --runner "$RUNNER_TEMP/usb-controller-build/freedv_voice_runner" \
          --rade-library "$RUNNER_TEMP/usb-controller-build/codec/rade_c/src/librade.so.0.1" \
          --output "$RUNNER_TEMP/usb-controller-matrix" --profile regression \
          --campaign-root "$RUNNER_TEMP/usb-controller-campaigns" \
          --source-commit "$GITHUB_SHA" --build-id "usb-controller-ci-${GITHUB_SHA}" \
          > "$RUNNER_TEMP/usb-controller-matrix.log" 2>&1 || {
            task_status=$?
            python3 tools/freedv/usb_ci_diagnostics.py --work-root "$RUNNER_TEMP"
            exit "$task_status"
          }
    - name: Retain bounded PCM only from failed public-fixture cases
      if: failure()
      timeout-minutes: 2
      run: |
        python3 tools/freedv/usb_ci_diagnostics.py --work-root "$RUNNER_TEMP" \
          --output "$RUNNER_TEMP/usb-controller-failure-fixtures"
    - name: Retain successful and failed build/campaign evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: usb-controller-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 14
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/usb-controller-build.log
          ${{ runner.temp }}/usb-controller-build/build-record.json
          ${{ runner.temp }}/usb-controller-build/*.log
          ${{ runner.temp }}/usb-controller-matrix.log
          ${{ runner.temp }}/usb-controller-matrix/**/*.json
          ${{ runner.temp }}/usb-controller-matrix/**/*.jsonl
          ${{ runner.temp }}/usb-controller-matrix/**/*.log
          ${{ runner.temp }}/usb-controller-matrix/**/*.txt
          ${{ runner.temp }}/usb-controller-matrix/**/default.pa
          ${{ runner.temp }}/usb-controller-campaigns/**/*.json
          ${{ runner.temp }}/usb-controller-failure-fixtures/
    - name: Retain actual tested-source receipt
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: tested-source-usb-controller-regression
        retention-days: 14
        if-no-files-found: error
        path: ${{ runner.temp }}/tested-source-usb-controller-regression.json
    - name: Retain pinned model acquisition receipt
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pinned-opus-model-acquisition
        retention-days: 14
        if-no-files-found: warn
        path: ${{ runner.temp }}/verified-opus-model/model-acquisition.json
