'on':
  push:
    branches:
    - ci/freedv-hardening-model-20261107.2
  workflow_dispatch: null
env:
  TESTED_SOURCE_COMMIT: 20cf0e65fecb6459fc8c7d6d40d65b514b82a11c
  OPUS_MODEL_SHA256: 4ed9445b96698bad25d852e912b41495ddfa30c8dbc8a55f9cde5826ed793453
