name: FreeDV retained capture regression
on:
  push:
    branches: [investigate-freedv-backlog-20261103]
    paths: ['.github/workflows/freedv-backlog.yml','backlog-20261103/**','probe-update-20261103/**']
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: backlog-20261103
      - run: sudo apt-get update -qq && sudo apt-get install -y pulseaudio libsamplerate0
      - name: Exercise isolated capture through long idle and legacy callback stalls
        run: |
          pulseaudio --version
          python3 backlog-20261103/run.py
