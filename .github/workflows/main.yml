name: Deliver verified X6200 diagnostic release assets

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: x6200-native-diagnostic-release-1
  cancel-in-progress: false

jobs:
  deliver:
    if: github.repository == 'bho18/OpenX6X00' && github.ref == 'refs/heads/delivery/x6200-native-release'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out delivery tooling only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate immutable artifacts and upload to the existing draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/freedv/test_upload_native_release.py
          python3 tools/freedv/upload_native_release.py --work "$RUNNER_TEMP/native-release-delivery"
      - name: Preserve delivery verification records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: x6200-native-release-delivery-record
          path: |
            ${{ runner.temp }}/native-release-delivery/delivery-manifest.json
            ${{ runner.temp }}/native-release-delivery/DOWNLOAD-SHA256SUMS
            ${{ runner.temp }}/native-release-delivery/verification.json
          if-no-files-found: warn
          retention-days: 14
