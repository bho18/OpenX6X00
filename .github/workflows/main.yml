name: FreeDV X6200 test card images
on:
  push:
    branches: [experiment/x6200-test-images]
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Successful or running pinned baseline image/SDK workflow run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  inventory-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Package read-only baseline test
        run: |
          mkdir -p "$RUNNER_TEMP/inventory-test"
          cp tools/freedv/inventory.py tools/freedv/collect_inventory.py tools/freedv/sources.json "$RUNNER_TEMP/inventory-test/"
          cp docs/freedv/inventory-test.md "$RUNNER_TEMP/inventory-test/README.md"
          export INVENTORY_PACKAGE="$RUNNER_TEMP/inventory-test"
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          p=pathlib.Path(os.environ['INVENTORY_PACKAGE'])
          files={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.iterdir())}
          metadata={'schema_version':1,'firmware_source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':files,'radio_control':False}
          (p/'PACKAGE.json').write_text(json.dumps(metadata,indent=2)+'\n')
          (p/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(p.iterdir())))
          PYTHON
          PULSE_SERVER=unix:/tmp/freedv-no-pulse python3 "$RUNNER_TEMP/inventory-test/collect_inventory.py" --output "$RUNNER_TEMP/inventory-host-smoke"
          python3 -c "import json; d=json.load(open('$RUNNER_TEMP/inventory-host-smoke/manifest.json')); assert not d['audio_recorded'] and not d['radio_settings_changed'] and not d['automatic_upload']"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: x6200-freedv-inventory-test
          path: ${{ runner.temp }}/inventory-test/
          if-no-files-found: error
          retention-days: 30
  build-package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Wait for and verify baseline SDK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          case "$BASELINE_RUN" in ''|*[!0-9]*) exit 1;; esac
          for attempt in $(seq 1 150); do
            state=$(gh api "repos/$REPOSITORY/actions/runs/$BASELINE_RUN" --jq '.status')
            if [ "$state" = completed ]; then break; fi
            echo "Waiting for pinned baseline SDK: $state ($attempt/150)"
            sleep 60
          done
          gh api "repos/$REPOSITORY/actions/runs/$BASELINE_RUN" > baseline-run.json
          python3 - <<'PY'
          import json
          r=json.load(open('baseline-run.json'))
          assert r['conclusion']=='success', 'baseline did not succeed'
          assert r['head_branch']=='experiment/x6200-baseline-sdk', 'unexpected baseline branch'
          assert r['path']=='.github/workflows/main.yml', 'unexpected baseline workflow'
          PY
          gh run download "$BASELINE_RUN" --repo "$REPOSITORY" --name x6200-freedv-baseline --dir baseline
          (cd baseline && sha256sum -c SHA256SUMS)
          test "$(cat baseline/buildroot-commit.txt)" = 8b7ca9d6d4e82ade0fc7654c46b9f8688689a4a3
          test "$(cat baseline/firmware-commit.txt)" = fd7f0bba70c0c8f8854219b6422600cbd428a6dc
          mkdir sdk
          set -- baseline/*sdk*.tar.gz
          test "$#" = 1
          tar -xzf "$1" -C sdk
          relocation=$(find "$PWD/sdk" -name relocate-sdk.sh -type f)
          test -n "$relocation"
          "$relocation"
          dirname "$relocation" > sdk-path.txt
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake autoconf automake libtool pkg-config libsamplerate0-dev python3 e2fsprogs qemu-user
      - name: Build pinned benchmarks with matching SDK
        run: |
          set -eu
          python3 tools/freedv/build_benchmark_package.py --work "$RUNNER_TEMP/freedv-package" \
            --sdk "$(cat sdk-path.txt)" --sdk-manifest baseline/buildroot-commit.txt --jobs 2 \
            > "$RUNNER_TEMP/freedv-package-build.log" 2>&1 || { status=$?; python3 -c 'import os,pathlib; t=pathlib.Path(os.environ["RUNNER_TEMP"],"freedv-package-build.log").read_text(errors="replace")[-2000:]; print("::error::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'; exit "$status"; }
          cp baseline-run.json "$RUNNER_TEMP/freedv-package/"
          cd "$RUNNER_TEMP/freedv-package"
          sha256sum freedv-benchmark-package.tar.gz freedv-benchmark-sources.tar.gz > ARCHIVE-SHA256SUMS
      - name: Check SDK ARM execution under emulation
        run: |
          set -eu
          sdk_dir=$(cat sdk-path.txt)
          compiler=$(find "$sdk_dir/bin" -maxdepth 1 -name 'arm*-gcc' | head -1)
          python3 tools/freedv/qemu_smoke.py --package "$RUNNER_TEMP/freedv-package/package" \
            --sysroot "$("$compiler" -print-sysroot)" --output "$RUNNER_TEMP/freedv-package/qemu-smoke"
      - name: Compile matching baseline and read-only diagnostic GUIs
        run: |
          set -eu
          trap 'echo "::error::Test image step failed at: $BASH_COMMAND"' ERR
          sdk_dir=$(cat sdk-path.txt)
          revision=$(git rev-parse HEAD)
          mkdir "$RUNNER_TEMP/test-images"
          for variant in baseline diagnostic-readonly; do
            enabled=OFF
            [ "$variant" != diagnostic-readonly ] || enabled=ON
            cmake -S . -B "$RUNNER_TEMP/gui-$variant" \
              -DCMAKE_TOOLCHAIN_FILE="$sdk_dir/share/buildroot/toolchainfile.cmake" \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHW_BACKEND=x6200 -DENABLE_FREEDV_DIAGNOSTICS="$enabled"
            cmake --build "$RUNNER_TEMP/gui-$variant" --target x6100_gui -j 2
            compiler=$(find "$sdk_dir/bin" -maxdepth 1 -name 'arm*-gcc' | head -1)
            prefix=${compiler%-gcc}
            "$prefix-objcopy" --only-keep-debug "$RUNNER_TEMP/gui-$variant/src/x6100_gui" "$RUNNER_TEMP/test-images/gui-$variant.debug"
            cp "$RUNNER_TEMP/gui-$variant/src/x6100_gui" "$RUNNER_TEMP/gui-$variant.runtime"
            "$prefix-strip" --strip-unneeded "$RUNNER_TEMP/gui-$variant.runtime"
            "$prefix-objcopy" --add-gnu-debuglink="$RUNNER_TEMP/test-images/gui-$variant.debug" "$RUNNER_TEMP/gui-$variant.runtime"
            python3 tools/freedv/prepare_test_image.py \
              --baseline baseline/OpenX6X00-x6200-local-sdcard.img \
              --gui "$RUNNER_TEMP/gui-$variant.runtime" \
              --package "$RUNNER_TEMP/freedv-package/package" --variant "$variant" \
              --firmware-commit "$revision" --output "$RUNNER_TEMP/test-images/x6200-$variant.img"
          done
          cp tools/freedv/sources.json "$RUNNER_TEMP/test-images/"
          cp docs/freedv/test-card.md "$RUNNER_TEMP/test-images/README.md"
          cp baseline-run.json "$RUNNER_TEMP/test-images/"
          cd "$RUNNER_TEMP/test-images"
          sha256sum *.img *.debug *.json README.md > SHA256SUMS
      - name: Upload test images and debug information
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: x6200-freedv-test-images
          path: ${{ runner.temp }}/test-images/
          if-no-files-found: error
          retention-days: 14
      - name: Upload benchmark test package and build record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: x6200-freedv-benchmark-package
          path: |
            ${{ runner.temp }}/freedv-package/freedv-benchmark-package.tar.gz
            ${{ runner.temp }}/freedv-package/freedv-benchmark-sources.tar.gz
            ${{ runner.temp }}/freedv-package/ARCHIVE-SHA256SUMS
            ${{ runner.temp }}/freedv-package/baseline-run.json
            ${{ runner.temp }}/freedv-package-build.log
            ${{ runner.temp }}/freedv-package/qemu-smoke/
          if-no-files-found: error
          retention-days: 14
