name: FreeDV native test kit delivery
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact draft release ID
        required: true
permissions:
  contents: write
jobs:
  deliver:
    if: github.repository == 'bho18/OpenX6X00' && github.ref == 'refs/heads/delivery/freedv-native-test-kit'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and package file-only helpers
        run: |
          set -eu
          python3 tools/freedv/test_native_session.py
          python3 tools/freedv/build_native_test_package.py --output "$RUNNER_TEMP/x6200-freedv-next-tests.zip"
      - name: Upload only to the exact matching draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request,urllib.parse
          token=os.environ['GH_TOKEN']; rid=os.environ['RELEASE_ID']
          if not rid.isdigit(): raise ValueError('numeric release ID required')
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          url='https://api.github.com/repos/bho18/OpenX6X00/releases/'+rid
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as response: release=json.load(response)
          assert release['draft'] and release['tag_name']=='freedv-native-test-kit-20261028.1'
          assert release['target_commitish']==os.environ['GITHUB_SHA']
          base=release['upload_url'].split('{')[0]
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          archive=root/'x6200-freedv-next-tests.zip'
          (root/'SHA256SUMS').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  '+archive.name+'\n')
          results=[]
          for path in [archive,root/'SHA256SUMS']:
              data=path.read_bytes(); digest='sha256:'+hashlib.sha256(data).hexdigest()
              request=urllib.request.Request(base+'?name='+urllib.parse.quote(path.name),data=data,
                  headers={**headers,'Content-Type':'application/octet-stream'},method='POST')
              with urllib.request.urlopen(request) as response: asset=json.load(response)
              assert asset['digest']==digest and asset['size']==len(data)
              results.append({'name':path.name,'size':len(data),'digest':digest,'id':asset['id']})
          (root/'delivery.json').write_text(json.dumps({'release_id':int(rid),'source':os.environ['GITHUB_SHA'],'assets':results},indent=2))
          print('Verified two uploaded assets. Release remains draft.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-test-kit-delivery
          path: |
            ${{ runner.temp }}/x6200-freedv-next-tests.zip
            ${{ runner.temp }}/SHA256SUMS
            ${{ runner.temp }}/delivery.json
          if-no-files-found: error
